name: PetMCP Sites candidate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/checkout@v4
        with:
          repository: smallgreen-cloud/spec
          ref: 05b98c23f307ed90814a2927e38fb3868bc887b5
          path: .spec
      - uses: actions/checkout@v4
        with:
          repository: smallgreen-cloud/conformance
          ref: e9ca52b9938e5b144ec8c382083470b4e58b260e
          path: .conformance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML jsonschema
      - run: python scripts/check-contracts.py --spec .spec
      - name: SmallGreen contract schemas
        run: python .conformance/scripts/check_contract.py --spec .spec --repo .
      - name: Sites-only profile (SAP-1 / SAP-2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .conformance/scripts/check_profile.py --spec .spec --repo .
      - name: Sites runtime bindings and secrets (CON-3)
        run: python .conformance/scripts/check_secrets_manifest.py --spec .spec --repo .
      - name: Preserve verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-verification
          path: evidence/
      - name: Explicit failure alert
        if: failure()
        run: |
          echo '::error title=PetMCP release blocked::Candidate checks failed. Do not publish as Ready. The maintainer must keep GitHub Actions failure email notifications enabled.'
