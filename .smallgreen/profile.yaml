schema_version: 0.3.0
profile: small-app
summary:
  purpose: 在自己的 ChatGPT Site 保存寵物血檢、日常照護、照片與食品營養標籤
  audience: 具有 ChatGPT Sites 建立權限、希望掌握個人寵物紀錄的飼主
  users_estimate: '1'
login_method: other
data:
  types:
  - pet profiles
  - raw lab measurements
  - care records
  - food label references
  - photos
  - audit history
  stored_in:
  - d1
  - r2
  notes: Sites 原生 ChatGPT 登入；平台受管 DB/BUCKET。AI 在 ChatGPT 原生環境執行，無外部 API key。
secrets: []
external_services: []
alt_deployment: []
build_requirements:
  runtime: node>=24
  package_manager: npm
  system_tools: []
  gates:
  - npm ci
  - npm test
  - npm run build
  notes: Sources packaged and published only through native Sites. No standalone Cloudflare
    deployment.
